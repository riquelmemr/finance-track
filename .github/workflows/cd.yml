name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}

  deploy-on-ec2:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: docker-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        id: ssm_deploy
        run: |
            cat <<EOF > ssm_params.json
            {
              "commands": [
                "docker pull ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest",
                "docker rm -f ${{ github.event.repository.name }} || true",
                "cat <<'ENV_EOF' > app.env\n${{ secrets.ENVIRONMENT_VARIABLES }}\nENV_EOF",
                "docker run -d --name ${{ github.event.repository.name }} --env-file app.env -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest",
                "rm app.env"
              ]
            }
            EOF
    
            echo "Sending command to EC2..."
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploying Java App via GitHub Actions" \
              --parameters file://ssm_params.json \
              --query "Command.CommandId" \
              --output text)
    
            echo "Command ID: \$COMMAND_ID"
    
            echo "Waiting for command execution..."
            aws ssm wait command-executed \
              --command-id "\$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
    
            # Validate the final execution status
            STATUS=$(aws ssm get-command-invocation \
              --command-id "\$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)
    
            if [ "\$STATUS" != "Success" ]; then
              echo "Deployment failed with status: \$STATUS"
              aws ssm get-command-invocation \
                --command-id "\$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            echo "Deployment successful!"